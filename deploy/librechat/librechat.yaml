# deploy/librechat/librechat.yaml — LibreChat do PicoZero (https://picozeroday.vercel.app/chat).
# O publicar.sh copia este arquivo para deploy/librechat.yaml no servidor (montado só leitura no contêiner).
# O único modelo é o assistente do PicoZero (API compatível com a da OpenAI em picozero-api:8000/v1): ele
# usa as mesmas regras e ferramentas do chat do painel, então o LibreChat não precisa de chave de nenhuma IA.
version: 1.3.18

cache: true

interface:
  customWelcome: 'Pergunte ao PicoZero sobre os picos de acesso do portal, os alertas ativos e o plano do dia.'
  # Cores do PicoZero: azul-marinho #12284C nos botões de envio e verde-água #00ADBB nos destaques.
  theme:
    version: 1
    name: picozero
    modes:
      light:
        colors:
          rgb-surface-submit: '18 40 76'
          rgb-surface-submit-hover: '10 27 53'
          rgb-accent-primary: '0 120 132'
          rgb-accent-primary-hover: '0 96 106'
          rgb-link: '0 120 132'
          rgb-link-hover: '0 96 106'
          rgb-ring-primary: '0 173 187'
      dark:
        colors:
          rgb-surface-submit: '0 140 153'
          rgb-surface-submit-hover: '0 115 126'
          rgb-accent-primary: '0 173 187'
          rgb-accent-primary-hover: '51 194 205'
          rgb-link: '51 194 205'
          rgb-link-hover: '102 208 217'
          rgb-ring-primary: '0 173 187'

endpoints:
  # A API do PicoZero fica na rede interna do Docker (endereço privado): libera só esse destino.
  allowedAddresses:
    - 'picozero-api:8000'
  custom:
    - name: 'PicoZero'
      apiKey: 'picozero'  # a rota /v1 só é alcançável pela rede interna; a chave só preenche o cabeçalho
      baseURL: 'http://picozero-api:8000/v1'
      models:
        default: ['picozero-assistente']
        fetch: false
      titleConvo: false
      modelDisplayLabel: 'PicoZero'

# Ferramentas do motor também por MCP (o chat acima já as usa por dentro).
mcpSettings:
  allowedAddresses:
    - 'picozero-api:8000'
mcpServers:
  picozero:
    type: streamable-http
    url: http://picozero-api:8000/mcp
    timeout: 60000
