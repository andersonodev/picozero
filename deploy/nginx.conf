# deploy/nginx.conf — serve o painel (frontend/dist) e repassa a API para o contêiner picozero-api.
server {
    listen 80;
    server_name _;
    absolute_redirect off;  # redireciona só pelo caminho (/chat -> /chat/), sem pôr o host interno na URL
    root /usr/share/nginx/html;
    client_max_body_size 30m;  # a ingestão aceita arquivos de até 25 MB

    location ~ ^/(api/|sim/|mcp/?$|docs|redoc|openapi\.json$) {
        proxy_pass http://picozero-api:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_set_header Connection "";
        # SSE (alertas ao vivo e simulação): sem buffer e com leitura longa.
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 1h;
    }

    # LibreChat em /chat: as rotas dele ficam na raiz, então o prefixo é tirado antes de repassar.
    # O contêiner é resolvido a cada pedido (resolver do Docker): se o LibreChat estiver parado, só o /chat
    # falha (502) e o nginx continua subindo normalmente.
    # Redireciona de verdade: o roteador do LibreChat (basename /chat/) não desenha nada em /chat sem a barra.
    location = /chat {
        return 302 /chat/;
    }

    location /chat/ {
        resolver 127.0.0.11 valid=10s ipv6=off;
        set $librechat http://librechat:3080;
        rewrite ^/chat/(.*)$ /$1 break;
        proxy_pass $librechat;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_set_header Connection "";
        # Respostas em SSE: sem buffer e com leitura longa.
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 1h;
        client_max_body_size 30m;
    }

    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    location / {
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ /index.html;
    }
}
